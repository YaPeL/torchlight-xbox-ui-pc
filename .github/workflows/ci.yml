name: CI
on:
  push:
  pull_request:
jobs:
  no-game-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No game files tracked
        run: python3 tools/check_no_game_files.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools' tests (synthetic data)
        run: python3 -m unittest discover -s tests -v
  proxy:
    # The proxy built from proxy/cegui_exports.txt alone, without the game's DLL, with the LLVM the
    # project builds with (the link is reproducible: the same bytes as a local build).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 21
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
      - name: Build both targets
        run: |
          python3 tools/build_proxy.py build "$RUNNER_TEMP/gog"
          python3 tools/build_proxy.py build "$RUNNER_TEMP/steam" --target steam
          sha256sum "$RUNNER_TEMP"/gog/CEGUIBase.dll "$RUNNER_TEMP"/steam/CEGUIBase.dll
  installer:
    # The C++ installer (installer/): built and tested on Linux and Windows, then checked against the
    # Python tools on synthetic data (tests/test_installer_cpp.py).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          cmake -S installer -B build-installer -DCMAKE_BUILD_TYPE=Release
          cmake --build build-installer --config Release --parallel
      - name: C++ tests
        run: ctest --test-dir build-installer -C Release --output-on-failure
      - name: Against the Python tools
        shell: bash
        run: |
          bin=build-installer/x360ui-install
          [ -f "$bin" ] || bin=build-installer/Release/x360ui-install.exe
          X360UI_INSTALLER="$PWD/$bin" python -m unittest tests.test_installer_cpp -v
