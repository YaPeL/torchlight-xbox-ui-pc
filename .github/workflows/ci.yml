name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  no-game-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No game files tracked
        run: python3 tools/check_no_game_files.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Tools' tests (synthetic data)
        run: python3 -m unittest discover -s tests -v
  proxy:
    # The proxy built from proxy/cegui_exports.txt alone, without the game's DLL, with the LLVM the
    # project builds with (the link is reproducible: the same bytes as a local build).
    runs-on: ubuntu-24.04
    # Ubuntu 26.04's LLVM 21 (the owner's machine's): the proxies' bytes the same as a local build.
    container: ubuntu:26.04
    steps:
      - name: LLVM 21, Ubuntu 26.04's own packages at a fixed version
        run: |
          # The whole toolchain (every package built from llvm-toolchain-21) held at this version,
          # whatever -updates publishes later.
          printf 'Package: src:llvm-toolchain-21\nPin: version 1:21.1.8-6ubuntu1\nPin-Priority: 1001\n' \
            > /etc/apt/preferences.d/llvm-21
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 \
            clang-21=1:21.1.8-6ubuntu1 lld-21=1:21.1.8-6ubuntu1 llvm-21=1:21.1.8-6ubuntu1
          clang-cl-21 --version
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build both targets
        run: |
          python3 tools/build_proxy.py build "$RUNNER_TEMP/gog"
          python3 tools/build_proxy.py build "$RUNNER_TEMP/steam" --target steam
          sha256sum "$RUNNER_TEMP"/gog/CEGUIBase.dll "$RUNNER_TEMP"/steam/CEGUIBase.dll
  installer:
    # The C++ installer (installer/): built and tested on Linux and Windows, then checked against the
    # Python tools on synthetic data (tests/test_installer_cpp.py).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: SDL's build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pkg-config libx11-dev \
            libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl-dev libgl-dev libdbus-1-dev libudev-dev libdecor-0-dev
      - name: Build
        run: |
          cmake -S installer -B build-installer -DCMAKE_BUILD_TYPE=Release
          cmake --build build-installer --config Release --parallel
      - name: C++ tests
        run: ctest --test-dir build-installer -C Release --output-on-failure
      - name: Against the Python tools
        shell: bash
        run: |
          bin=build-installer/x360ui-install
          [ -f "$bin" ] || bin=build-installer/Release/x360ui-install.exe
          mkdir -p wizard-shots
          X360UI_SHOTS="$PWD/wizard-shots" X360UI_INSTALLER="$PWD/$bin" python -m unittest tests.test_installer_cpp -v
      - name: The wizard's screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wizard-shots-${{ matrix.os }}
          path: wizard-shots/
          if-no-files-found: ignore
