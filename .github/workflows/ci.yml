name: CI
on:
  push:
  pull_request:
jobs:
  no-game-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No game files tracked
        run: python3 tools/check_no_game_files.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools' tests (synthetic data)
        run: python3 -m unittest discover -s tests -v
