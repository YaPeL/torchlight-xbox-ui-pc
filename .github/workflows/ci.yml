name: CI
on:
  push:
  pull_request:
jobs:
  no-game-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No game files tracked
        run: python3 tools/check_no_game_files.py
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools' tests (synthetic data)
        run: python3 -m unittest discover -s tests -v
  proxy:
    # The proxy built from proxy/cegui_exports.txt alone, without the game's DLL, with the LLVM the
    # project builds with (the link is reproducible: the same bytes as a local build).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LLVM 21
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 21
          echo /usr/lib/llvm-21/bin >> "$GITHUB_PATH"
      - name: Build both targets
        run: |
          python3 tools/build_proxy.py build "$RUNNER_TEMP/gog"
          python3 tools/build_proxy.py build "$RUNNER_TEMP/steam" --target steam
          sha256sum "$RUNNER_TEMP"/gog/CEGUIBase.dll "$RUNNER_TEMP"/steam/CEGUIBase.dll
